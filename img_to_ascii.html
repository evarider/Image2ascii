<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to ASCII</title>
<style>
  :root{--bg:#f2f3f0;--panel:#fff;--ink:#1c2321;--muted:#66706b;--line:#cfd5d0;--accent:#2f6f5e;--accent-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#161a19;--panel:#1f2523;--ink:#e6ebe8;--muted:#8f9b95;--line:#37403d;--accent:#5cb89f;--accent-ink:#0d1a16}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px}
  main{max-width:1000px;margin:0 auto;display:grid;gap:20px}
  h1{margin:0;font-size:1.5rem}
  p.sub{margin:4px 0 0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;align-content:start}
  #drop{border:2px dashed var(--line);border-radius:8px;min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;padding:12px;overflow:hidden}
  #drop.over,#drop:focus-visible{border-color:var(--accent);outline:none;color:var(--ink)}
  #drop img{max-width:100%;max-height:220px;display:block}
  label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
  label span b{color:var(--ink);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
  .check{display:flex;gap:8px;align-items:center}
  button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  textarea{width:100%;height:480px;resize:vertical;font:7px/7px ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  #status{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <header>
    <h1>Image to ASCII</h1>
    <p class="sub">Drop an image, press Create, copy the text. Everything runs in your browser.</p>
  </header>
  <div class="grid">
    <section class="panel">
      <div id="drop" tabindex="0" role="button" aria-label="Choose or drop an image">
        <div id="dropMsg">Drop an image here<br>or click to choose one</div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <label><span>Width: <b id="wv">120</b> characters</span>
        <input id="width" type="range" min="20" max="300" value="120"></label>
      <label>Character set
        <select id="charset">
          <option value="@%#*+=-:. ">Classic (@%#*+=-:. )</option>
          <option value="█▓▒░ ">Blocks (█▓▒░)</option>
          <option value="$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~<>i!lI;:,&quot;^`'. ">Detailed (70 levels)</option>
          <option value="01 ">Binary (01)</option>
        </select></label>
      <label class="check"><input id="invert" type="checkbox"> Invert (for light text on dark background)</label>
      <button id="go" class="primary" disabled>Create</button>
    </section>
    <section class="panel">
      <div class="bar">
        <span id="status">No image yet</span>
        <div class="row">
          <button id="copy" disabled>Copy</button>
          <button id="save" disabled>Download .txt</button>
        </div>
      </div>
      <textarea id="out" readonly spellcheck="false" aria-label="ASCII output"></textarea>
    </section>
  </div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var drop=$('drop'),file=$('file'),go=$('go'),out=$('out'),status=$('status');
  var img=null;

  function load(f){
    if(!f||f.type.indexOf('image/')!==0){status.textContent='That file is not an image.';return}
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      img=im;
      drop.innerHTML='';
      im.style.maxWidth='100%';im.style.maxHeight='220px';
      drop.appendChild(im);
      go.disabled=false;
      status.textContent=f.name+' ('+im.naturalWidth+'×'+im.naturalHeight+')';
    };
    im.onerror=function(){status.textContent='Could not read that image.'};
    im.src=url;
  }

  function create(){
    if(!img)return;
    var cols=parseInt($('width').value,10);
    var chars=Array.from($('charset').value);
    if($('invert').checked)chars.reverse();
    // characters are about twice as tall as wide, so halve the row count
    var rows=Math.max(1,Math.round(cols*(img.naturalHeight/img.naturalWidth)*0.5));
    var c=document.createElement('canvas');c.width=cols;c.height=rows;
    var ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cols,rows); // flatten transparency onto white
    ctx.drawImage(img,0,0,cols,rows);
    var d=ctx.getImageData(0,0,cols,rows).data,lines=[],n=chars.length;
    for(var y=0;y<rows;y++){
      var line='';
      for(var x=0;x<cols;x++){
        var i=(y*cols+x)*4;
        var g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; // luminance, 0 dark to 255 light
        line+=chars[Math.min(n-1,Math.floor(g/256*n))];
      }
      lines.push(line);
    }
    out.value=lines.join('\n');
    // shrink the font so wide output fits without sideways scroll
    var px=Math.max(3,Math.min(10,Math.floor(out.clientWidth/cols/0.6)));
    out.style.fontSize=px+'px';out.style.lineHeight=px+'px';
    status.textContent=cols+'×'+rows+' characters';
    $('copy').disabled=false;$('save').disabled=false;
  }

  drop.addEventListener('click',function(){file.click()});
  drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}});
  file.addEventListener('change',function(){load(file.files[0])});
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){load(e.dataTransfer.files[0])});
  document.addEventListener('paste',function(e){
    var items=e.clipboardData&&e.clipboardData.files;
    if(items&&items[0])load(items[0]);
  });
  $('width').addEventListener('input',function(){$('wv').textContent=this.value;if(img)create()});
  $('charset').addEventListener('change',function(){if(img)create()});
  $('invert').addEventListener('change',function(){if(img)create()});
  go.addEventListener('click',create);
  $('copy').addEventListener('click',function(){
    navigator.clipboard.writeText(out.value).then(function(){status.textContent='Copied to clipboard'},function(){out.select();document.execCommand('copy');status.textContent='Copied to clipboard'});
  });
  $('save').addEventListener('click',function(){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out.value],{type:'text/plain'}));
    a.download='ascii.txt';a.click();
  });
})();
</script>
</body>
</html>
